# Checks the AI kit: generated copies match their sources and config files parse.
# Optional in a Drupal project that uses the kit — keep it to catch drift after
# editing skills or subagents, or leave it out when copying `.github/`.
name: Kit check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generated copies match their sources
        run: .agents/sync.sh --check

      - name: Settings and agent files parse
        run: |
          jq empty .claude/settings.json
          python3 -c "
          import glob, tomllib
          for path in ['.codex/config.toml', *glob.glob('.codex/agents/*.toml')]:
              tomllib.load(open(path, 'rb'))
          "

      - name: Detection script has no syntax errors
        run: php -l .agents/skills/generate-agents-md/scripts/detect-environment.php
